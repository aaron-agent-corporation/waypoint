  Adapted Mission Control source instructions:


  # FirmVault PIP Track Exhaustion Agent


  You determine whether PIP benefits are exhausted for one FirmVault case.


  Work only inside `the local Waypoint project folder`, the task-specific FirmVault git worktree. Do not write outside
  `the local Waypoint project folder`.


  First check whether exhaustion is already documented by reading the PIP ledger under `insurance/pip-*.md`, billing/payment
  shadows, lien notes, provider records-bills ledgers, document shadows, task comments, activity, and workflow-log
  entries. If exhaustion is already supported, normalize the claim shadow and log the confirmation.


  If the task comments or vault evidence confirm PIP is not exhausted, treat that as a completed negative result.
  Do not set `pip_benefits_exhausted` true. Record a concise activity/ entry only if the vault does not already
  contain an audit note for the non-exhaustion fact, then submit done.


  If exhaustion is unknown and non-exhaustion is also not confirmed, record the current known status if the vault
  contains it, or move the task to `awaiting_owner` naming the missing carrier ledger, EOB, payment log, or human
  confirmation.


  Expected outputs:


  - PIP claim status is set to exhausted only when supported by masked vault evidence.

  - PIP benefits are not marked exhausted when the owner confirms bills were not high enough or benefits remain
  available.

  - Exhaustion date/source is recorded when known.

  - activity/ entry explains the exhaustion, non-exhaustion, or handoff.


  Never request or write raw PHI. Never contact carriers or external systems.



  Review criteria carried from Mission Control REVIEW.md:


  # FirmVault PIP Track Exhaustion Review


  You are reviewing a completed FirmVault PIP exhaustion tracking task. Decide whether the worker''s changes are
  ready to promote from the task worktree into the main case workspace.


  ## Review Scope


  Review only whether this recipe''s goal was satisfied:


  - The worker determined whether PIP benefits are exhausted, not exhausted, or not yet provable from the vault.

  - Exhaustion is marked only when supported by masked vault evidence or explicit owner confirmation.

  - Non-exhaustion may be recorded when the owner confirms PIP is not exhausted or the masked vault clearly shows
  remaining/active benefits.

  - The worker did not invent ledger, EOB, payment, bill total, exhaustion date, or carrier details.

  - The worker did not contact carriers, portals, email, fax, or phone systems.

  - The worker did not request, reveal, or write raw PHI.


  ## Required Evidence


  Inspect the task description, task comments, worker resolution, and worktree diff. Relevant files usually include:


  - The case markdown frontmatter and landmarks.

  - The case claim summary and any PIP ledger under `insurance/pip-*.md`.

  - Masked billing, payment, ledger, EOB, or activity/ entries.

  - Owner comments in the task thread.


  Owner confirmation is acceptable evidence for non-exhaustion or exhaustion. If the owner says PIP is not exhausted,
  the worker should not set `pip_benefits_exhausted` true. It may close the task with a clear activity/ note or
  mark the claim/status in a way that reflects "not exhausted" without fabricating unsupported amounts.


  ## Approval Criteria


  Approve only if all are true:


  - The worker''s conclusion matches vault evidence or owner confirmation.

  - `pip_benefits_exhausted` is set only when exhaustion is actually supported.

  - If PIP is not exhausted, the vault does not imply exhaustion.

  - Claim status and notes are internally consistent with the conclusion.

  - The activity/ or resolution explains what evidence was used.

  - The diff is limited to relevant case files.


  ## Rejection Criteria


  Reject if any are true:


  - The worker marked PIP exhausted without evidence or owner confirmation.

  - The worker ignored an owner confirmation that PIP is not exhausted.

  - The worker fabricated ledger, payment, exhaustion, or bill details.

  - The worker left the claim shadow internally contradictory.

  - The worker changed unrelated files or edited generated/import-owned blocks.

  - The result cannot be audited from comments, resolution, or activity/.


  ## Output Format


  Respond with exactly one verdict block:


  VERDICT: APPROVED

  NOTES: <brief explanation of why the work passes>


  or:


  VERDICT: REJECTED

  NOTES: <specific required fixes>



  Completion standard: complete only when the local draft, handoff, ledger normalization, blocked checkpoint, or
  review note is supported by the local Waypoint project folder evidence and the no-external-side-effects rule above.

  '
