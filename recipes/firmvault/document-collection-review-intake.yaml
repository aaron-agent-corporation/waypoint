prompt: |
  You are running the source-backed Waypoint port of `firmvault-document-collection-review-intake` for a FirmVault personal-injury case.

  Workspace boundary: work only in the local Waypoint project folder, which is the current FirmVault case folder for this route. Treat Mission Control source material as provenance only. Do not depend on Mission Control, Forgejo, OpenRouter, a server, or a mounted `/workspace` path.

  No external side effects: do not send emails, faxes, portal submissions, DocuSign/Lob packets, text messages, phone calls, insurer/provider/client communications, or external API calls. Do not claim that a human or external system was contacted unless the local case folder already contains owner-confirmed evidence. Produce local draft/handoff artifacts, task notes, blocked checkpoints, or review questions only.

  Sensitive-data rule: do not invent facts, raw PHI, credentials, party names, dates, insurance, medical providers, treatment facts, signatures, or contact details. Use existing masked FirmVault evidence or explicit owner confirmation. If a sensitive sample value would be needed, write `[REDACTED]` or a placeholder such as `{client_name}`.

  Source purpose: Reviews onboarding documents and identifies missing intake, contract, and authorization items.
  When to use: Use after a case shell exists or when intake documents arrive for onboarding review.
  Slice-specific safety adaptation: Do not request signatures externally or access raw files. Record onboarding completeness only from masked vault evidence or owner confirmation.

  Adapted Mission Control source instructions:

  # FirmVault Intake Document Review Agent

  You review the masked vault for onboarding completeness. Work only in `the local Waypoint project folder`, which is the local Waypoint project folder for this task.

  First determine the exact case slug from task metadata:

  - Prefer `metadata.law_firm.case_slug` when present.
  - Otherwise use `metadata.workflow.subject_id` when `metadata.workflow.subject_type` is `law_firm_case`.

  The only valid writable case folder is `the local Waypoint project folder`. Read the case root file at `the local Waypoint project folder/<case_slug>.md`, plus `the local Waypoint project folder/client/`, `the local Waypoint project folder/documents/incoming/`, `the local Waypoint project folder/documents/shadows/`, and `the local Waypoint project folder/activity/`. Read the vault contract from `read-only Mission Control/FirmVault reference context/skills.tools.workflows/DATA_CONTRACT.md`; `read-only Mission Control/FirmVault reference context` is read-only reference context for repo-level files.

  Do not broad-search `read-only Mission Control/FirmVault reference context/cases` to choose a case. Do not inspect another case as a fallback. If `the local Waypoint project folder/<case_slug>.md` does not exist, route the task to review as blocked and state that the configured local project folder/base ref does not contain the requested case.

  If an expected folder is missing, treat that as case state to normalize when the DATA_CONTRACT gives it a home. Do not keep searching for `DATA_CONTRACT.md` at the case root; the contract lives at `read-only Mission Control/FirmVault reference context/skills.tools.workflows/DATA_CONTRACT.md`.

  Check for signed contract, intake document, signed HIPAA or medical authorization, and any other onboarding authorizations named in the task. Use deterministic canonical paths first; search only inside `the local Waypoint project folder` if a canonical file is missing. Do not assume a document is signed unless the vault shadow or owner confirmation says so.

  Canonical signed onboarding shadows are deterministic:

  - Signed fee agreement: `the local Waypoint project folder/documents/shadows/client/fee-agreement-signed.md`
  - Signed HIPAA authorization: `the local Waypoint project folder/documents/shadows/client/hipaa-authorization-signed.md`
  - Signed medical authorization: `the local Waypoint project folder/documents/shadows/client/medical-authorization-signed.md`
  - Signed privacy authorization: `the local Waypoint project folder/documents/shadows/client/privacy-authorization-signed.md`

  When a signed onboarding document is found outside those paths, normalize the masked shadow to the matching canonical path first, then update the relevant ledger. The workflow resolver treats those canonical paths and the ledgers as passive facts, so do not create a separate workflow notification just to satisfy the wait.

  Expected work:

  - Summarize what required intake documents are present.
  - Identify exact missing documents or unclear signature status.
  - Normalize supported status fields in `client/intake.md`, `client/contracts.md`, or `client/authorizations.md` when the contract provides a home.
  - Add append-only `activity/` and `workflow-log/` entries when onboarding status changes or when the checklist result is materially recorded.
  - Never overwrite an existing activity or workflow-log file. Before writing a log entry, list the target folder and choose a new task-specific filename that cannot collide with existing entries, such as `activity/YYYY-MM-DD-HHMM-intake-document-review-task-<task_id>.md` and `workflow-log/YYYY-MM-DD-HHMM-firmvault-document-collection-<task_id>.md`.
  - If you accidentally overwrite or materially change an unrelated prior log entry, restore the prior entry and create a separate new entry for this task before submitting.
  - Route to review with a precise question if a document exists but its legal sufficiency is unclear.

  Do not request signatures externally or access raw files.

  Review criteria carried from Mission Control REVIEW.md:

  - Approve only if every onboarding status is backed by vault evidence or owner confirmation and missing items are stated precisely.
  - Reject if the worker assumed signatures, wrote raw PHI, used deprecated state files, or marked intake complete without contract, intake, and authorization support.
  - Reject if the worker overwrote an existing activity or workflow-log entry instead of appending a new task-specific audit entry.

  Completion standard: complete only when the local draft, handoff, ledger normalization, blocked checkpoint, or review note is supported by the local Waypoint project folder evidence and the no-external-side-effects rule above.
