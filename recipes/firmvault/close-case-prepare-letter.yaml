# Source-backed FirmVault Recipe port for Waypoint FVP6-G close-case wave.
schema_version: 1
slug: firmvault-close-case-prepare-letter
name: FirmVault Close Case - Prepare Closing Letter
description: Prepare a local client closing-letter draft and human-send handoff from verified closure facts.
prompt: |
  You are running the source-backed Waypoint port of `firmvault-close-case-prepare-letter` for a FirmVault personal-injury case.

  Workspace boundary: work only in the local Waypoint project folder, which is the current FirmVault case folder. Treat Mission Control workflow source material as provenance only. Do not depend on Mission Control, Forgejo, OpenRouter, a server, or a mounted `/workspace` path.

  No external side effects: do not send emails, faxes, portal submissions, DocuSign/Lob packets, text messages, phone calls, client/lien-holder/provider/insurer communications, review requests, archive actions, trust-account actions, payments, deposits, releases, or external API calls. Do not claim that a human, bank, insurer, lien holder, provider, client, archive location, or external system was contacted unless the local case folder already contains owner-confirmed evidence. Produce local drafts, ledgers, handoffs, blocked notes, or review questions only.

  Sensitive-data rule: do not invent facts, raw PHI, credentials, party names, dates, insurance, medical providers, lien holders, treatment facts, signatures, settlement funds, trust-account balances, final-letter send facts, archive references, retention dates, client responses, closure authority, deadlines, promises, or contact details. Use existing masked FirmVault evidence or explicit owner confirmation. If a sensitive sample value would be needed, write `[REDACTED]` or a placeholder such as `{client_name}`.

  Source purpose: Prepare a client closing-letter draft using verified closure facts without sending it or starting archive work.

  Adapted Mission Control workflow instructions from `workflows/firmvault-close-case.yaml` node `prepare_closing_letter`:

  Prepare a client closing-letter draft using the verified closure facts. Write the draft under documents/generated/client/ and a send handoff under closing/. The letter should thank the client, confirm the case is closed after final distribution, explain retention in general terms, and avoid unsupported promises. Do not send the letter, request a review, or archive the file.

  Canonical local evidence to review:
  - `.waypoint/firmvault/settlement.yaml`
  - `closing/readiness-checklist.md` or other local closure-readiness checklist
  - `settlement/settlement.md`
  - `settlement/distribution.md`
  - `documents/generated/client/`
  - `closing/`
  - `activity/`
  - `workflow-log/`

  Completion standard: complete only when the local draft closing letter and human-send handoff are supported by verified local closure evidence and the no-external-side-effects rule above. Do not mark the final letter sent; that requires the human send gate and explicit evidence.
tools:
- file_read
- search_files
- file_write
