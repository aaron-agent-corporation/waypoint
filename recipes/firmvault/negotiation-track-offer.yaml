name: FirmVault Negotiation - Track Offer
description: Logs a supported incoming offer or demand response without evaluating or responding.
prompt: 'You are running the source-backed Waypoint port of `firmvault-negotiation-track-offer` for a FirmVault personal-injury
  case.


  Workspace boundary: work only in the local Waypoint project folder, which is the current FirmVault case folder. Treat Mission
  Control workflow source material as provenance only. Do not depend on Mission Control, Forgejo, OpenRouter, a server, or
  a mounted `/workspace` path.


  No external side effects: do not send emails, faxes, portal submissions, DocuSign/Lob packets, text messages, phone calls,
  insurer/provider/client communications, or external API calls. Do not claim that a human or external system was contacted
  unless the local case folder already contains owner-confirmed evidence. Produce local draft/handoff artifacts, task notes,
  blocked checkpoints, or review questions only.


  Sensitive-data rule: do not invent facts, raw PHI, credentials, party names, dates, insurance, medical providers, treatment
  facts, signatures, lien facts, amounts, offers, settlement terms, deadlines, or contact details. Use existing masked FirmVault
  evidence or explicit owner confirmation. If a sensitive sample value would be needed, write `[REDACTED]` or a placeholder
  such as `{client_name}`.


  Source purpose: Logs a supported incoming offer or demand response without evaluating or responding.


  Adapted Mission Control workflow instructions:


  Determine whether a real offer or substantive demand response has been received. First inspect canonical FirmVault negotiation
  and insurance paths for an existing offer with date, amount, source, and claim/carrier. Then inspect same-task human/operator
  comments for offer details. If no offer details are present, prepare a precise review request for offer date, amount, carrier/adjuster,
  claim number, conditions, deadline, and response type. If an offer is supported, update negotiation/offers.md, the applicable
  insurance ledger, activity, and workflow-log. Do not evaluate the offer, recommend acceptance/counter, contact the client,
  or respond to the carrier.


  Canonical paths from the source workflow:

  - `negotiation/offers.md`

  - `insurance/`

  - `demand/demand-package.md`

  - `documents/received/insurance/`

  - `documents/shadows/insurance/`

  - `activity/`

  - `workflow-log/`


  Completion standard: complete only when the local ledger, handoff, blocked checkpoint, or review note is supported by local
  Waypoint project folder evidence and the no-external-side-effects rule above.

  '
