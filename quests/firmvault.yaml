            waypoint:
              node:
                type: recipe
              recipe:
                slug: firmvault-document-collection-request-missing-documents
            source_port:
              workflow_id: firmvault-document-collection
              source_node: request_missing_documents
        - plan_ref: firmvault-document-collection-signature-packet-handoff
          title: Prepare signature packet handoff without sending externally
          wave: 50
          metadata:
            waypoint:
              node:
                type: recipe
              recipe:
                slug: firmvault-document-collection-send-signature-packets
            source_port:
              workflow_id: firmvault-document-collection
              source_node: send_signature_packets
        - plan_ref: firmvault-document-collection-wait-signed-documents
          title: Wait/checkpoint for signed onboarding documents
          wave: 60
          metadata:
            waypoint:
              node:
                type: wait
              wait:
                kind: passive_landmark_or_time
                landmark: contract_signed_and_medical_auth_signed
