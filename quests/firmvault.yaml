          title: Create or verify the FirmVault case folder shell
          wave: 10
          metadata:
            waypoint:
              node:
                type: recipe
              recipe:
                slug: firmvault-case-setup-create-shell
            source_port:
              workflow_id: firmvault-case-setup
              source_node: create_case_workspace
        - plan_ref: firmvault-case-setup-human-review
          title: Human review of case setup before downstream work
          wave: 20
          metadata:
            waypoint:
              node:
                type: gate
              gate:
                required: true
                kind: human_case_setup_review
            source_port:
              workflow_id: firmvault-case-setup
              source_node: human_case_setup_review
        - plan_ref: firmvault-document-collection-review-intake-task
