schema_version: 1
slug: referral-package
name: Referral Package
workflow: referral-package

# Builds an attorney referral handoff package from messy case documents while keeping source material read-only.
description: attorney referral handoff package Quest for reviewing, organizing, naming, QCing, and preparing a safe handoff package.

recipes:
  - referral-package-document-reviewer
  - referral-package-packet-segmenter
  - referral-package-filename-placement-reviewer
  - firmvault-medical-chronology-update
  - firmvault-medical-chronology-adversarial-qc
  - referral-package-start-here-builder
  - referral-package-package-qc

metadata:
  waypoint:
    quest_family: primary_starter
    selection_summary: attorney referral handoff package assembly with safe document review and QC
  source:
    project: llm-lawyer
    path: docs/referrals/referral-package-and-document-naming-sop.md
    local_snapshot: /Users/aaronwhaley/Github/llm-lawyer/docs/referrals
    ported_at: '2026-05-18'
  safety:
    source_files_read_only: true
    external_side_effects: forbidden
    legal_facts_satisfied_by_output: false
    firmvault_state_mutation: forbidden_without_approved_apply

scaffolds:
  workstreams:
    - key: referral-package
      name: Referral Package
      milestones:
        - version_label: v1
          title: Attorney referral package handoff
          phases:
            - phase_key: RP1
              phase_slug: intake-review
              lifecycle_phase: discover
              plans:
                - plan_ref: source-inventory
                  title: Inventory source documents and preserve original paths/hashes
                  wave: 1
                  metadata:
                    waypoint:
                      node:
                        type: checkpoint
                - plan_ref: document-review
                  title: Review each source document for type, parties, dates, confidence, and handling notes
                  wave: 1
                  metadata:
                    waypoint:
                      node:
                        type: checkpoint
            - phase_key: RP2
              phase_slug: document-organization
              lifecycle_phase: plan
              plans:
                - plan_ref: packet-segmentation
                  title: Split or segment bundled packets into reviewable source-backed documents when appropriate
                  wave: 2
                  metadata:
                    waypoint:
                      node:
                        type: checkpoint
                - plan_ref: filename-placement
                  title: Propose canonical referral filenames and destination folders
                  wave: 2
                  metadata:
                    waypoint:
                      node:
                        type: checkpoint
                - plan_ref: ambiguity-review
                  title: Convert low-confidence placement and classification into review questions
                  wave: 2
                  metadata:
                    waypoint:
                      node:
                        type: checkpoint
            - phase_key: RP3
              phase_slug: medical-chronology
              lifecycle_phase: execute
              plans:
                - plan_ref: medical-chronology-update
                  title: Build medical chronology and binder if medical records are present
                  wave: 3
                  metadata:
                    waypoint:
                      required_when: medical_records_present
                      recipe:
                        slug: firmvault-medical-chronology-update
                      output_artifacts:
                        - 03-medical/medical-chronology-output/reports/date-of-service-ledger.json
                        - 03-medical/medical-chronology-output/reports/visit-content.json
                        - 03-medical/medical-chronology-output/reports/rendered-template-check.json
                        - 03-medical/medical-chronology-output/medical-chronology.html
                        - 03-medical/medical-chronology-output/medical-chronology-timeline.pdf
                        - 03-medical/medical-chronology-output/medical-chronology-master-binder.pdf
                        - 03-medical/medical-chronology-output/extracted-visit-pdfs/
                      artifact_verifier:
                        kind: required_paths
                        checks:
                          - exists
                          - non_empty
                          - directory_non_empty
                      instructions:
                        - Start by extracting a structured date-of-service ledger, using bills/itemizations/ledgers as a first-pass DOS source and medical records for clinical confirmation.
                        - Fill structured visit-content JSON for each ledger encounter before rendering.
                        - Render attorney-facing chronology HTML through the shared deterministic template, not agent-authored HTML.
                        - Create one extracted visit PDF per chronology row/date-of-service encounter.
                        - Deduplicate repeated provider productions from visible source buttons.
                        - Keep source files read-only and keep chronology artifacts review-aid only.
                      node:
                        type: recipe
                - plan_ref: medical-chronology-adversarial-qc
                  title: Independently QC medical chronology before package dashboard/QC if medical records are present
                  wave: 3
                  metadata:
                    waypoint:
                      required_when: medical_records_present
                      recipe:
                        slug: firmvault-medical-chronology-adversarial-qc
                      output_artifacts:
                        - 03-medical/medical-chronology-output/adversarial-qc-report.md
                      artifact_verifier:
                        kind: required_paths
                        checks:
                          - exists
                          - non_empty
                      review:
                        independent: true
                        checks:
                          - visual_source_inspection
                          - visit_level_consolidation
                          - extracted_visit_pdf_per_row
                          - deduplicated_source_buttons
                          - chronology_first_binder_order
                          - attorney_facing_no_process_meta
                          - source_link_and_layout_qc
                      node:
                        type: recipe
            - phase_key: RP4
              phase_slug: package-drafting
              lifecycle_phase: execute
              plans:
                - plan_ref: start-here-draft
                  title: Draft START_HERE attorney case dashboard with facts, current status, medical summary, medical chronology HTML/PDF links, timeline, and evidence map
                  wave: 4
                  metadata:
                    waypoint:
                      recipe:
                        slug: referral-package-start-here-builder
                      output_artifacts:
                        - referral-package-build/attorney-handoff/START_HERE.html
                        - referral-package-build/attorney-handoff/START_HERE.pdf
                      artifact_verifier:
                        kind: required_paths
                        checks:
                          - exists
                          - non_empty
                      node:
                        type: recipe
                - plan_ref: package-index
                  title: Draft package index and cross-reference organized documents
                  wave: 4
                  metadata:
                    waypoint:
                      output_artifacts:
                        - referral-package-build/attorney-handoff/PACKAGE_INDEX.md
                        - referral-package-build/attorney-handoff/PACKAGE_FILE_INDEX.csv
                      artifact_verifier:
                        kind: required_paths
                        checks:
                          - exists
                          - non_empty
                      node:
                        type: artifact
            - phase_key: RP5
              phase_slug: quality-control
              lifecycle_phase: verify
              plans:
                - plan_ref: package-qc
                  title: QC referral package completeness, naming, source traceability, medical chronology artifacts when medical records are present, and safety boundaries
                  wave: 5
                  metadata:
                    waypoint:
                      recipe:
                        slug: referral-package-package-qc
                      output_artifacts:
                        - referral-package-build/build-internal/package-qc-report.json
                      artifact_verifier:
                        kind: required_paths
                        checks:
                          - exists
                          - non_empty
                      node:
                        type: recipe
                - plan_ref: attorney-handoff-gate
                  title: Human gate before any attorney-facing handoff or external action
                  wave: 5
                  metadata:
                    waypoint:
                      gate:
                        required: true
                        kind: attorney_handoff_approval
                      node:
                        type: gate
            - phase_key: RP6
              phase_slug: handoff
              lifecycle_phase: ship
              plans:
                - plan_ref: handoff-ready-summary
                  title: Produce final handoff-ready summary and explicit unresolved-item checklist
                  wave: 6
                  metadata:
                    waypoint:
                      node:
                        type: handoff
                      handoff:
                        kind: attorney_referral_package
                        gate_required: true
                        gate_ref: attorney-handoff-gate
