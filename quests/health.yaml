# Waypoint GSD catalog Quest port from commands/gsd/health.md.
#
# Current Quest schema has no first-class command graph field, so command
# mapping and orchestration intent are preserved in metadata.gsd_port.

schema_version: 1
slug: health
name: Health Quest
description: >
  Waypoint catalog Quest port of gsd:health for planning-directory and workflow health diagnostic.
workflow: workflows/gsd/health.yaml

recipes:
  - gsd-verifier

scaffolds:
  workstreams:
    - key: delivery
      name: Delivery
      milestones:
        - version_label: v1
          title: Health Quest loop
          phases:
            - phase_key: "10"
              phase_slug: health
              lifecycle_phase: health
              plans:
                - plan_ref: health-intake
                  title: Capture inputs and current context
                  wave: 10
                - plan_ref: health-run
                  title: Run the mapped Waypoint Recipes
                  wave: 20
                - plan_ref: health-report
                  title: Produce operator-facing output and next actions
                  wave: 30

metadata:
  source:
    project: get-shit-done-cc
    local_reference: /Users/aaronwhaley/Downloads/get-shit-done-main
    license: MIT
  tags:
    - gsd-port
    - quest-catalog
  gsd_port:
    scope: command_informed_sub_quest
    category: audit_review
    role: audit / review sub-Quest
    source_command: commands/gsd/health.md
    source_command_name: gsd:health
    intent: Check planning/state integrity and report repair or context-health recommendations.
    operator_interaction: command arguments, review gates, and follow-up decisions when required
    runtime_notes:
      - Quest and Recipe are Waypoint primitives; workflow YAML remains the internal execution substrate.
      - This command is modeled as a catalog Quest using only current schema fields.
      - Detailed command flags and execution semantics remain metadata/docs until first-class runtime support is added.
