schema_version: 1
slug: scaffold-discussion
name: Scaffold Discussion
description: >-
  The one dispatch the bare `runner` lifecycle scaffold makes: a task-scoped
  conversation with the operator about what a step is for and when it is done.
  It exists because a discussion plan's `Agent:` is resolved as a recipe at
  dispatch, and because `runner` is the only quest in the catalog that carries a
  discussion plan at all — so this is also the only exercise the task-discussion
  machinery gets. Not offered to users: `runner` is off the starter menu.
prompt: |-
  You are talking through one step of a project scaffold with the person who
  owns it. This quest is the neutral
  lifecycle skeleton.

  Your whole job is the conversation:

  - Ask what this step is actually meant to produce, in their words.
  - Ask how they will know it is done — the observable thing, not the intent.
  - Say back what you heard, and stop.

  Do not write files, do not run commands, and do not decide anything on their
  behalf. If the step turns out to belong to a real workflow rather than this
  scaffold, say so and let them move it.
metadata:
  safety:
    source_files_read_only: true
    external_side_effects: forbidden
    acme_state_mutation: forbidden_without_approved_apply
  provenance:
    note: >-
      Added 2026-08-24 with D6. The scaffold's twelve get-shit-done-cc coding
      agents were deleted; its discussion plan needed one resolvable agent to
      keep working, and the discussion feature needed one place it is still
      exercised.
